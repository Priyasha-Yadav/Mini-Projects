<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="main">
        <div id="screen">
            0
        </div>
        <div class="numbers">
            <div class="num first" onclick="Clear()" value="c">C</div>
            <div class="num first" onclick="display('+/-')" value="+/-">+/-</div>
            <div class="num first" onclick="display('%')" value="%">%</div>
            <div class="num operator" onclick="display('/')" value="/">÷</div>
            <div class="num" onclick="display('7')" value="7">7</div>
            <div class="num" onclick="display('8')" value="8">8</div>
            <div class="num" onclick="display('9')" value="9">9</div>
            <div class="num operator" onclick="display('*')" value="*">x</div>
            <div class="num" onclick="display('4')" value="4">4</div>
            <div class="num" onclick="display('5')" value="5">5</div>
            <div class="num" onclick="display('6')" value="6">6</div>
            <div class="num operator" onclick="display('-')" value="-">-</div>
            <div class="num" onclick="display('1')" value="1">1</div>
            <div class="num" onclick="display('2')" value="2">2</div>
            <div class="num" onclick="display('3')" value="3">3</div>
            <div class="num operator" onclick="display('+')" value="+">+</div>
            <div class="num zero" onclick="display('0')" value="0">0</div>
            <div class="num" onclick="display('.')" value=".">.</div>
            <div class="num operator" onclick="solve()" value="=">=</div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
